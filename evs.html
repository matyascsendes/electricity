<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%94%8B%3C/text%3E%3C/svg%3E">
<title>EVs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --bg: #0d0d10;
  --surface: #16161c;
  --surface2: #1e1e26;
  --border: #2a2a35;
  --text: #e8e8f0;
  --muted: #7a7a92;
  --enyaq: #4ade80;
  --enyaq-dim: rgba(74,222,128,0.15);
  --ec4: #fb923c;
  --ec4-dim: rgba(251,146,60,0.15);
  --charge: #60a5fa;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #f2f2f7;
  --surface: #ffffff;
  --surface2: #f8f8fc;
  --border: #dddde8;
  --text: #111118;
  --muted: #6b6b82;
}}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Syne', sans-serif; font-size: 14px; min-height: 100vh; margin-left: 180px; }
@media(max-width:768px){ body { margin-left: 0; } }
.mono { font-family: 'DM Mono', monospace; }

/* Header */
.header { padding: 28px 32px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-bottom: 1px solid var(--border); }
.header-title { display: flex; align-items: baseline; gap: 12px; }
.header-title h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
.header-title span { color: var(--muted); font-size: 13px; font-family: 'DM Mono', monospace; }
.date-row { display: flex; align-items: center; gap: 8px; }
.date-row label { color: var(--muted); font-size: 12px; }
.date-row input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 6px; font-size: 12px; font-family: 'DM Mono', monospace; }
.date-row button { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: background 0.15s; }
.date-row button:hover { background: var(--border); }

/* Comparison grid */
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-bottom: 1px solid var(--border); }
.car-col { padding: 24px 32px; }
.car-col.enyaq { border-right: 1px solid var(--border); }
.car-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.car-icon { flex-shrink: 0; }
.car-name { display: flex; flex-direction: column; gap: 2px; }
.car-name strong { font-size: 18px; font-weight: 700; }
.car-name small { color: var(--muted); font-size: 12px; font-family: 'DM Mono', monospace; }
.accent-enyaq { color: var(--enyaq); }
.accent-ec4 { color: var(--ec4); }

/* Stat tiles */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 0; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.stat-val { font-size: 22px; font-weight: 700; font-family: 'DM Mono', monospace; font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 4px; }
.stat-lbl { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.enyaq .stat-val { color: var(--enyaq); }
.ec4 .stat-val { color: var(--ec4); }
.stat-note { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; margin-top: 2px; }

/* Charts section */
.charts { padding: 0 0 32px; }
.chart-row { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--border); }
.chart-panel { padding: 24px 32px; }
.chart-panel.full { grid-column: 1 / -1; border-right: none; }
.chart-panel.left { border-right: 1px solid var(--border); }
.chart-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 16px; }
.chart-wrap { position: relative; height: 200px; }
.chart-wrap.tall { height: 240px; }

/* Trip distribution side by side */
.dist-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border-bottom: 1px solid var(--border); }

/* No data state */
.no-data { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-size: 12px; font-family: 'DM Mono', monospace; }

/* Legend */
.legend { display: flex; gap: 16px; margin-top: 10px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

@media (max-width: 700px) {
  .compare, .chart-row, .dist-row { grid-template-columns: 1fr; }
  .car-col.enyaq { border-right: none; border-bottom: 1px solid var(--border); }
  .chart-panel.left { border-right: none; border-bottom: 1px solid var(--border); }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .header, .car-col, .chart-panel { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>

// ── Date filter ────────────────────────────────────────────────────────────
let dateFrom = '2025-10-01', dateTo = '2026-10-04';

function applyDates() {
  dateFrom = document.getElementById('dateFrom').value;
  dateTo = document.getElementById('dateTo').value;
  rebuildAll();
}

function inRange(d) { return d >= dateFrom && d <= dateTo; }

// ── Stats computation ─────────────────────────────────────────────────────
function computeENYAQ() {
  const trips = RAW.enyaq.filter(t => inRange(t.date) && !t.short && t.km > 0);
  const totalKm = trips.reduce((s,t) => s+t.km, 0);
  const totalKwh = trips.filter(t=>t.kwh>0).reduce((s,t) => s+t.kwh, 0);
  const eff = totalKm>0 ? totalKwh/totalKm*100 : 0;
  const maxTrip = trips.length ? Math.max(...trips.map(t=>t.km)) : 0;
  const chg = RAW.charges.filter(c => inRange(c.date));
  const totalCharged = chg.reduce((s,c) => s+c.kwh, 0);
  const fastChg = chg.filter(c => c.durMin>0 && c.kwh/c.durMin*60>22).length;
  return {totalKm, eff, maxTrip, tripCount: trips.length, totalCharged, sessions: chg.length, fastChg};
}

function computeEC4() {
  // eC4 only has monthly aggregates; use them filtered by month range
  let totalKm = 0, months = 0;
  for (const [m, km] of Object.entries(RAW.ec4_monthly)) {
    const monthStart = m + '-01';
    const monthEnd = m + '-31';
    if (monthStart <= dateTo && monthEnd >= dateFrom) { totalKm += km; months++; }
  }
  return {totalKm, months};
}

// ── Chart helpers ─────────────────────────────────────────────────────────
const ENYAQ_COLOR = '#4ade80';
const EC4_COLOR = '#fb923c';
const CHARGE_COLOR = '#60a5fa';
const TEXT_COLOR = '#7a7a92';
const GRID_COLOR = 'rgba(255,255,255,0.06)';

const baseOpts = (yLabel='') => ({
  responsive: true, maintainAspectRatio: false,
  plugins: { legend: { display: false }, tooltip: { callbacks: { label: (ctx) => ` ${ctx.parsed.y} ${yLabel}` } } },
  scales: {
    x: { grid: { color: GRID_COLOR }, ticks: { color: TEXT_COLOR, font: { family: 'DM Mono', size: 10 }, maxRotation: 0 } },
    y: { grid: { color: GRID_COLOR }, ticks: { color: TEXT_COLOR, font: { family: 'DM Mono', size: 10 } }, beginAtZero: true }
  }
});

const charts = {};
function destroyAll() { Object.values(charts).forEach(c => c.destroy()); Object.keys(charts).forEach(k => delete charts[k]); }

function monthLabel(m) {
  const [yr, mo] = m.split('-');
  return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+mo-1] + (yr==='2026'?'':'\'25');
}

function getMonthlyData(source, valueKey) {
  const months = getFilteredMonths();
  return { labels: months.map(monthLabel), values: months.map(m => Math.round(source[m] || 0)) };
}

function getFilteredMonths() {
  const all = ["2025-10","2025-11","2025-12","2026-01","2026-02","2026-03","2026-04","2026-05","2026-06","2026-07","2026-08","2026-09","2026-10"];
  return all.filter(m => (m+'-01') <= dateTo && (m+'-28') >= dateFrom);
}

// Charging-to-km factor derived from Apr-Oct 2026 overlap (525 kWh consumed / 904 kWh charged)
const CHARGE_KM_FACTOR = 3.52; // km per kWh charged
// Months where we have no trip data — estimate from charging
const TRIP_DATA_START = '2026-04';

// ── Build charts ───────────────────────────────────────────────────────────
function buildKmChart(id, data, color, estData) {
  const ctx = document.getElementById(id).getContext('2d');
  const opts = baseOpts('km');
  opts.scales.y.ticks.callback = v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v;
  opts.plugins.tooltip.callbacks.label = ctx => {
    const suffix = ctx.dataset.label === '≈ est.' ? ' km (est. from charging)' : ' km';
    return ` ${ctx.parsed.y}${suffix}`;
  };
  const datasets = [{ data: data.values, backgroundColor: color+'33', borderColor: color, borderWidth: 1.5, borderRadius: 3, label: 'km' }];
  if (estData) datasets.unshift({ data: estData.values, backgroundColor: color+'18', borderColor: color+'55', borderWidth: 1, borderRadius: 3, label: '≈ est.' });
  charts[id] = new Chart(ctx, { type: 'bar', data: { labels: data.labels, datasets }, options: opts });
}

function buildEffChart() {
  const months = getFilteredMonths();
  const effByMonth = {};
  RAW.enyaq.filter(t => !t.short && t.km > 5 && t.kwh > 0 && inRange(t.date)).forEach(t => {
    const m = t.date.slice(0,7);
    if (!effByMonth[m]) effByMonth[m] = [0,0];
    effByMonth[m][0] += t.kwh; effByMonth[m][1] += t.km;
  });
  const labels = months.filter(m => effByMonth[m]).map(monthLabel);
  const values = months.filter(m => effByMonth[m]).map(m => +(effByMonth[m][0]/effByMonth[m][1]*100).toFixed(1));
  const ctx = document.getElementById('effChart').getContext('2d');
  const opts = baseOpts('kWh/100');
  opts.scales.y.min = 10; opts.scales.y.max = 25;
  opts.plugins.tooltip.callbacks.label = ctx => ` ${ctx.parsed.y} kWh/100km`;
  charts['effChart'] = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: [{ data: values, borderColor: ENYAQ_COLOR, backgroundColor: ENYAQ_COLOR+'22', fill: true, tension: 0.4, pointRadius: 4, pointBackgroundColor: ENYAQ_COLOR }] },
    options: opts
  });
}

function buildChargeChart() {
  const chargeByMonth = {};
  RAW.charges.filter(c => inRange(c.date)).forEach(c => {
    const m = c.date.slice(0,7);
    chargeByMonth[m] = (chargeByMonth[m]||0) + c.kwh;
  });
  const months = getFilteredMonths().filter(m => chargeByMonth[m]);
  const ctx = document.getElementById('chargeChart').getContext('2d');
  charts['chargeChart'] = new Chart(ctx, {
    type: 'bar',
    data: { labels: months.map(monthLabel), datasets: [{ data: months.map(m => Math.round(chargeByMonth[m]||0)), backgroundColor: CHARGE_COLOR+'33', borderColor: CHARGE_COLOR, borderWidth: 1.5, borderRadius: 3 }] },
    options: baseOpts('kWh')
  });
}

function buildDistChart(id, distObj, color) {
  const bins = ['<5','5-15','15-30','30-50','50-100','>100'];
  const labels = ['<5km','5-15','15-30','30-50','50-100','>100'];
  const values = bins.map(b => distObj[b]||0);
  const ctx = document.getElementById(id).getContext('2d');
  charts[id] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: color+'33', borderColor: color, borderWidth: 1.5, borderRadius: 3 }] },
    options: { ...baseOpts('trips'), plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.y} trips` } } } }
  });
}

function buildENYAQDist() {
  const dist = {'<5':0,'5-15':0,'15-30':0,'30-50':0,'50-100':0,'>100':0};
  RAW.enyaq.filter(t => inRange(t.date) && !t.short).forEach(t => {
    const km = t.km;
    if(km<5) dist['<5']++;
    else if(km<15) dist['5-15']++;
    else if(km<30) dist['15-30']++;
    else if(km<50) dist['30-50']++;
    else if(km<100) dist['50-100']++;
    else dist['>100']++;
  });
  buildDistChart('enyaqDistChart', dist, ENYAQ_COLOR);
}

function buildSocChart() {
  const chg = RAW.charges.filter(c => inRange(c.date));
  const bins = {0:0,20:0,40:0,60:0,80:0};
  chg.forEach(c => { const b = Math.floor(c.startSoc/20)*20; bins[Math.min(b,80)]++; });
  const labels = ['0-20%','20-40%','40-60%','60-80%','80-100%'];
  const vals = [0,20,40,60,80].map(b => bins[b]||0);
  const ctx = document.getElementById('socChart').getContext('2d');
  charts['socChart'] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data: vals, backgroundColor: CHARGE_COLOR+'33', borderColor: CHARGE_COLOR, borderWidth: 1.5, borderRadius: 3 }] },
    options: { ...baseOpts('sessions'), plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.y} sessions` } } } }
  });
}

function buildChargeDistChart() {
  const chg = RAW.charges.filter(c => inRange(c.date));
  const bins = {'<15':0,'15-25':0,'25-35':0,'35-45':0,'>45':0};
  chg.forEach(c => {
    if(c.kwh<15) bins['<15']++;
    else if(c.kwh<25) bins['15-25']++;
    else if(c.kwh<35) bins['25-35']++;
    else if(c.kwh<45) bins['35-45']++;
    else bins['>45']++;
  });
  const labels = ['<15kWh','15-25','25-35','35-45','>45'];
  const vals = ['<15','15-25','25-35','35-45','>45'].map(b=>bins[b]);
  const ctx = document.getElementById('chargeDistChart').getContext('2d');
  charts['chargeDistChart'] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data: vals, backgroundColor: ENYAQ_COLOR+'33', borderColor: ENYAQ_COLOR, borderWidth: 1.5, borderRadius: 3 }] },
    options: { ...baseOpts('sessions'), plugins: { legend: { display: false } } }
  });
}

// ── Stats display ─────────────────────────────────────────────────────────
function renderStats() {
  const e = computeENYAQ();
  const ec4 = computeEC4();

  document.getElementById('enyaq-stats').innerHTML = `
    <div class="stat"><div class="stat-val">${e.totalKm.toLocaleString('hu')}</div><div class="stat-lbl">km driven</div></div>
    <div class="stat"><div class="stat-val">${e.eff.toFixed(1)}</div><div class="stat-lbl">kWh/100km</div></div>
    <div class="stat"><div class="stat-val">${e.maxTrip}</div><div class="stat-lbl">longest trip km</div></div>
    <div class="stat"><div class="stat-val">${e.tripCount}</div><div class="stat-lbl">trips</div></div>
    <div class="stat"><div class="stat-val">${Math.round(e.totalCharged)}</div><div class="stat-lbl">kWh charged</div><div class="stat-note">${e.fastChg} fast DC</div></div>
    <div class="stat"><div class="stat-val">${e.sessions}</div><div class="stat-lbl">charge sessions</div></div>
  `;

  document.getElementById('ec4-stats').innerHTML = `
    <div class="stat"><div class="stat-val">${ec4.totalKm.toLocaleString('hu')}</div><div class="stat-lbl">km driven</div></div>
    <div class="stat"><div class="stat-val">—</div><div class="stat-lbl">kWh/100km</div><div class="stat-note">no export</div></div>
    <div class="stat"><div class="stat-val">56</div><div class="stat-lbl">longest trip km</div></div>
    <div class="stat"><div class="stat-val">891</div><div class="stat-lbl">trips</div></div>
    <div class="stat"><div class="stat-val">7.1</div><div class="stat-lbl">avg trip km</div></div>
    <div class="stat"><div class="stat-val">${ec4.months}</div><div class="stat-lbl">months data</div></div>
  `;
}

// ── Rebuild everything ────────────────────────────────────────────────────
function rebuildAll() {
  destroyAll();
  renderStats();

  const enyaqMonthly = {};
  RAW.enyaq.filter(t => !t.short && t.km > 0).forEach(t => {
    const m = t.date.slice(0,7);
    enyaqMonthly[m] = (enyaqMonthly[m]||0) + t.km;
  });

  // Charging by month for km estimation (months before trip data starts)
  const chargeByMonth = {};
  RAW.charges.filter(c => inRange(c.date)).forEach(c => {
    const m = c.date.slice(0,7);
    chargeByMonth[m] = (chargeByMonth[m]||0) + c.kwh;
  });

  const fm = getFilteredMonths();
  // Actual trip km (0 for months before April 2026)
  const enyaqActual = fm.map(m => m >= TRIP_DATA_START ? Math.round(enyaqMonthly[m]||0) : 0);
  // Estimated km from charging for pre-April 2026 months
  const enyaqEst = fm.map(m => m < TRIP_DATA_START ? Math.round((chargeByMonth[m]||0) * CHARGE_KM_FACTOR) : 0);

  const enyaqData = { labels: fm.map(monthLabel), values: enyaqActual };
  const enyaqEstData = { labels: fm.map(monthLabel), values: enyaqEst };
  const ec4Data = { labels: fm.map(monthLabel), values: fm.map(m => Math.round(RAW.ec4_monthly[m]||0)) };

  buildKmChart('enyaqKmChart', enyaqData, ENYAQ_COLOR, enyaqEstData);
  buildKmChart('ec4KmChart', ec4Data, EC4_COLOR);
  buildEffChart();
  buildChargeChart();
  buildENYAQDist();
  buildDistChart('ec4DistChart', RAW.ec4_trip_dist, EC4_COLOR);
  buildSocChart();
  buildChargeDistChart();
}

rebuildAll();
